# Server Configuration
server.port=8080

# Spring Application
spring.application.name=jsqlint-server
spring.main.banner-mode=off

# DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/jsqlint?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# SQL Initialization
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/init.sql

# MyBatis Plus Configuration
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=cn.jnu.zhangcs.jsqlint.server.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.banner=false

# JWT Configuration
jwt.secret=JSqlintSecretKey2026VeryLongAndSecureKeyForProduction
jwt.expiration=86400000