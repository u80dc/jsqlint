spring.application.name=book-management-mixed

spring.datasource.url=${BOOK_MANAGEMENT_MIXED_MYSQL_URL:jdbc:mysql://localhost:3306/book_management_mixed?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${BOOK_MANAGEMENT_MIXED_MYSQL_USER:root}
spring.datasource.password=${BOOK_MANAGEMENT_MIXED_MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=cn.jnu.zhangcs.jsqlint.analysis.fixture.bookmanagement.entity
mybatis.configuration.map-underscore-to-camel-case=true
