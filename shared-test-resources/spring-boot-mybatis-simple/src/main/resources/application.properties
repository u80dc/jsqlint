spring.application.name=spring-boot-mybatis-simple

spring.datasource.url=${SPRING_BOOT_MYBATIS_MYSQL_URL:jdbc:mysql://localhost:3306/spring_boot_mybatis_simple?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${SPRING_BOOT_MYBATIS_MYSQL_USER:root}
spring.datasource.password=${SPRING_BOOT_MYBATIS_MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=cn.jnu.zhangcs.jsqlint.analysis.fixture.springbootmybatis.entity
mybatis.configuration.map-underscore-to-camel-case=true
