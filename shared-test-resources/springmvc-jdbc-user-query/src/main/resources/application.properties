spring.application.name=springmvc-jdbc-user-query
server.address=127.0.0.1
server.port=8080

# 每次应用进程启动都创建独立的内存数据库，无需外部数据库服务。
spring.datasource.url=jdbc:h2:mem:springmvc_jdbc_users;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true
