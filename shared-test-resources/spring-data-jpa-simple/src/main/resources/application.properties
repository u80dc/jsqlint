spring.application.name=spring-data-jpa-simple

spring.datasource.url=${SPRING_DATA_JPA_MYSQL_URL:jdbc:mysql://localhost:3306/spring_data_jpa_simple?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${SPRING_DATA_JPA_MYSQL_USER:root}
spring.datasource.password=${SPRING_DATA_JPA_MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.mapping-resources=META-INF/orm.xml
spring.sql.init.mode=always
