spring.application.name=spring-jdbc-simple

spring.datasource.url=${SPRING_JDBC_MYSQL_URL:jdbc:mysql://localhost:3306/spring_jdbc_simple?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${SPRING_JDBC_MYSQL_USER:root}
spring.datasource.password=${SPRING_JDBC_MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
